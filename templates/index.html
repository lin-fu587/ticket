<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QWER 讓票即時看板</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #101010; color: #f3f5f7; padding: 20px; max-width: 600px; margin: auto; }
        h1 { text-align: center; font-size: 20px; margin-bottom: 20px; }
        .post-card { background: #181818; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .user-info { font-weight: bold; color: #1d9bf0; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .time { font-size: 12px; color: #777; font-weight: normal; }
        .content { white-space: pre-wrap; font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
        .btn-link { display: inline-block; padding: 6px 12px; background: #0095f6; color: white; text-decoration: none; border-radius: 6px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>QWER 讓票 / 賣票即時看板</h1>
    
    {% for post in posts %}
        <div class="post-card">
            <div class="user-info">
                <span>@{{ post[0] }}</span>
                <span class="time">{{ post[3] }}</span>
            </div>
            <div class="content">{{ post[1] }}</div>
            {% if post[2] %}
                <a href="{{ post[2] }}" target="_blank" class="btn-link">開啟原貼文</a>
            {% endif %}
        </div>
    {% else %}
        <p style="text-align:center; color: #888;">正在檢索資訊中或目前暫無貼文...</p>
    {% endfor %}
</body>
</html>
